sirius:
  topology:
    num_gpus: 1
  space:
    gpu:
      - device_id: 0
        memory_capacity: 12000000000
        reservation_limit_fraction: 1.0
    host:
      - numa_id: 0
        memory_capacity: 32000000000
        block_size: 1048576
        pool_size: 512
        initial_number_pools: 10
      - numa_id: 1
        memory_capacity: 32000000000
        block_size: 1048576
        pool_size: 512
        initial_number_pools: 10
  executor:
    pipeline:
      num_threads: 1
    duckdb_scan:
      num_threads: 2
    task_creator:
      num_threads: 2
    downgrade:
      num_threads: 1
      monitor_period_ms: 10
  operator_params:
    scan_task_batch_size: 100000000
    default_scan_task_varchar_size: 256
    max_sort_partition_bytes: 0
    hash_partition_bytes: 100000000
    concat_batch_bytes: 100000000
    max_build_hash_table_bytes: 90000000
